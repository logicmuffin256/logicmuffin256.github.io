name: CI for Angular Application

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch
  pull_request:
    branches:
      - main  # Trigger the workflow on pull requests against the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # Action to checkout the repository

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'  # Specify the Node.js version

      - name: Install dependencies
        run: npm install  # Install Angular dependencies

      - name: Build Angular application
        run: npm run build  # Build the Angular application

      - name: Upload build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: angular-build
          path: dist/  # Specify the build output directory
